<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLYBARKA — Official</title>
  <meta name="description" content="Official contact page for ONLYBARKA, independent artist and singer-songwriter.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, #202020 0, #0d0d0d 38%, #050505 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(92%, 620px);
      text-align: center;
      padding: 56px 30px;
      border: 1px solid #292929;
      border-radius: 24px;
      background: rgba(12, 12, 12, 0.82);
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #050505;
      font-size: 30px;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 76px);
      letter-spacing: .08em;
      line-height: 1;
    }
    .role {
      margin: 18px 0 42px;
      color: #aaa;
      font-size: 15px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .contact {
      border-top: 1px solid #292929;
      padding-top: 28px;
    }
    .name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .email {
      color: #fff;
      font-size: 16px;
      text-decoration: none;
    }
    .email:hover { text-decoration: underline; }
    footer {
      margin-top: 38px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">O</div>
    <h1>ONLYBARKA</h1>
    <p class="role">Independent Artist · Singer-Songwriter</p>

    <section class="contact">
      <div class="name">Camilo Corbalan</div>
      <a class="email" href="mailto:barkitax@gmail.com">barkitax@gmail.com</a>
    </section>

    <footer>Official artist contact</footer>
  </main>
</body>
</html>
